<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login Admin | SMP Islam Parung</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-page">

  <main class="lp-card">
    <img src="../img/logo.jpeg" alt="Logo SMP Islam Parung" class="lp-logo">

    <h1>ADMIN</h1>
    <p class="lp-sub1">SMP Islam Parung</p>
    <p class="lp-sub2">Dashboard Pendaftar PPDB</p>

    <div class="form-error" id="loginError" hidden></div>

    <form id="formLogin" novalidate>
      <div class="lp-field">
        <label for="email">Username (email)</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>

      <div class="lp-field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="lp-btn" id="tombolMasuk">Masuk</button>
    </form>

    <p class="lp-copy">Copyright &copy; 2026 SMP Islam Parung</p>
    <a href="../index.html" class="lp-back">&larr; Kembali ke website</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
